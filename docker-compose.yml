services:
  # NOTE on replicas:
  # `deploy.replicas` is respected by Docker Swarm, and by `docker compose up --scale app=N`,
  # but is IGNORED by plain `docker compose up`. To actually run 2 replicas locally, use:
  #
  #   docker compose up --build --scale app=2 -d
  #
  # Combined with docker-compose.override.yml this maps replica 1 → host :3001 and
  # replica 2 → host :3002. The plain `docker compose up` command launches a single
  # instance on the default port.
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: legal-results-service:latest
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379
    deploy:
      replicas: 2
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  redis_data:
