services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: legal-results-service:latest
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379
    deploy:
      replicas: 2
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis_data:
